name: Temporary Independent Evaluator Sanity
on:
  push:
    branches:
      - feature/independent-qualitative-evaluator
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run control-vs-control sanity evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_CONTROL_URL: https://develop--portfolio-gpt.netlify.app
          EVAL_TREATMENT_URL: https://develop--portfolio-gpt.netlify.app
          EVAL_CONTROL_ID: develop-A
          EVAL_TREATMENT_ID: develop-B
          EVAL_MODEL: gpt-4.1-mini
        run: npm run eval:harness -- --sanity --output evaluation-results/sanity
      - name: Upload sanity results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-evaluator-sanity-${{ github.run_id }}
          path: evaluation-results/sanity
          if-no-files-found: warn
          retention-days: 30
